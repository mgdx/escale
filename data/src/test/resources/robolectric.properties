# Version d'Android simulée par Robolectric pour les tests JVM de :data.
#
# Elle est fixée ici, et pas laissée au `compileSdk` du module : Robolectric ne sait simuler que
# les versions d'Android pour lesquelles il publie une image, et le `compileSdk` du projet (37)
# est en avance sur celles que Robolectric 4.16 connaît. Sans cette ligne, chaque test Room
# échouerait au démarrage sur une image introuvable.
#
# API 34 suffit : ce qui est éprouvé ici, c'est SQLite et Room, dont le comportement ne dépend pas
# de la version simulée. `minSdk` reste 26 et le comportement réel est vérifié sur l'appareil.
sdk=34
