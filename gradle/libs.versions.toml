# Catalogue de versions du projet Escale.
#
# Ce fichier est FIGÉ par le lot fondation (docs/architecture.md § 3, règle 1). Il déclare d'emblée
# toutes les bibliothèques prévues par la spec, y compris celles que les jalons suivants seront
# seuls à utiliser. Un lot qui a besoin d'une de ces bibliothèques l'ajoute au build.gradle.kts de
# son module ; il ne touche pas à ce catalogue. Une bibliothèque absente d'ici se demande au
# superviseur, elle ne s'ajoute pas d'autorité.

[versions]
# --- Chaîne de compilation -------------------------------------------------------------------
agp = "9.3.2"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"

# --- Qualité ---------------------------------------------------------------------------------
ktlintPlugin = "14.2.0"
ktlintTool = "1.8.0"
detekt = "1.23.8"

# --- Kotlin / coroutines ---------------------------------------------------------------------
coroutines = "1.10.2"
kotlinxSerialization = "1.9.0"

# --- Réseau ----------------------------------------------------------------------------------
# Ktor 3.3.x est la dernière lignée compilée avec Kotlin 2.2 : au-delà, les métadonnées sont
# produites par Kotlin 2.3 et le compilateur 2.2.10 du projet ne sait pas les lire.
ktor = "3.3.3"
# OkHttp est le moteur du client Ktor ; la version est alignée sur celle que ktor-client-okhttp
# résout de lui-même, pour éviter un mélange de versions.
okhttp = "5.2.1"

# --- Carte -----------------------------------------------------------------------------------
maplibre = "13.6.0"

# --- AndroidX --------------------------------------------------------------------------------
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.0"
room = "2.8.4"
datastore = "1.2.1"
composeBom = "2026.02.01"

# --- Tests -----------------------------------------------------------------------------------
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
turbine = "1.2.1"
robolectric = "4.16.1"

[libraries]
# --- Kotlin ----------------------------------------------------------------------------------
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Réseau ----------------------------------------------------------------------------------
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# --- Carte -----------------------------------------------------------------------------------
# Variante **OpenGL** et non la variante par défaut : `org.maplibre.gl:android-sdk` est compilée
# pour Vulkan et injecte dans le manifeste fusionné un
# `<uses-feature android:name="android.hardware.vulkan.version" android:required="true" />`, qui
# rend l'application impossible à installer sur tout appareil sans Vulkan — alors que `minSdk`
# vaut 26 et que SPEC.md § 3 promet Android 8. `android-sdk-opengl` porte le même code, rendu par
# OpenGL ES, et n'exige rien de tel.
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }

# --- Persistance -----------------------------------------------------------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Interface -------------------------------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- Tests -----------------------------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- Outil ktlint, résolu par le plugin ktlint ------------------------------------------------
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlintTool" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
